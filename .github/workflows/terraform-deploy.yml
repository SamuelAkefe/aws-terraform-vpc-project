name: "Terraform Infrastructure Deployment"

on: 
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

jobs:
    terraform:
        name: "Terraform"
        runs-on: ubuntu-latest

        steps:
            #1. Checkout the code
            - name: Checkout
              uses: actions/checkout@v3
        
            # =================================
            - name: Debug - What files are here?
              run: |
                echo "Current directory: $(pwd)"
                ls -R
            # =================================

            #2.  Security Scan (IaC)
            - name: Run Trivy vulnerability scanner in IaC mode
              uses: aquasecurity/trivy-action@master
              with:
                scan-type: 'config'
                hide-progress: false
                format: 'table'
                exit-code: '1'
                ignore-unfixed: true
                severity: 'CRITICAL,HIGH'


            #3. Setup Terraform
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v2
              with:
                terraform_version: 1.5.0

            #4. Initialize Terraform (Download providers & backend)
            - name: Terraform init
              id: init
              run: terraform init
              env:
                AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                AWS_DEFAULT_REGION: us-east-1

            #5. Check Formatting (Fail only if code is ugly )
            - name: Terraform Format
              id: fmt
              run: terraform fmt -check

            # 6. Validate Syntax
            - name: Terraform Validate
              id: validate
              run: terraform validate

            # 7. Terraform Plan (Show us what will happen)
            - name: Terraform Plan
              id: plan
              if: github.event_name == 'pull_request'
              run: terraform plan -no-color -input=false
              continue-on-error: true
              env:
                AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                AWS_DEFAULT_REGION: us-east-1

            # 8. Terraform Apply (only runs on push to main)
            - name: Terraform Apply
              if: github.ref == 'refs/heads/main' && github.event_name == 'push'
              run: terraform apply -auto-approve -input=false
              env: 
                AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
                AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                AWS_DEFAULT_REGION: us-east-1

